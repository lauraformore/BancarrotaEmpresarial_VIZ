title: "Modelo de Clasificación Binaria para la Predicción de Bancarrota Empresarial a partir de Estados Financieros: Dataset Taiwan Economic Journal"
author: "Laura Rivera · Natalý Cárdenas — Universidad del Norte"

execute:
  execute_notebooks: "off"   # ya tienen las salidas guardadas, no se re-ejecutan

html:
  use_repository_button: true

repository:
  url: https://github.com/lauraformore/BancarrotaEmpresarial_VIZ
  branch: main

sphinx:
  config:
    html_static_path: ["style"]
    html_css_files: ["custom.css"]
  extra_extensions:
    - sphinx_design   # necesario para los ::::{grid} y :::{grid-item-card} de tu index.md

exclude_patterns: ["README.md"]
